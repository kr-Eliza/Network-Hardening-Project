<title>Lab topology</title>
<defs>
  <linearGradient id="neonh" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="0"><stop offset="0" stop-color="#ff5fae"/><stop offset="1" stop-color="#9b6bff"/></linearGradient>
  <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff5fae"/><stop offset="1" stop-color="#9b6bff"/></linearGradient>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#07040f"/><stop offset="0.62" stop-color="#1a0b2e"/><stop offset="1" stop-color="#07040f"/></linearGradient>
  <linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffd1e6"/><stop offset="1" stop-color="#e2d4ff"/></linearGradient>
  <filter id="glow" filterUnits="userSpaceOnUse" x="-800" y="-800" width="2600" height="2400"><feGaussianBlur stdDeviation="3.5" result="b"/>
    <feComponentTransfer in="b" result="c"><feFuncA type="linear" slope="1.0"/></feComponentTransfer>
    <feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs><style>
  .scroll { animation: scroll 3s linear infinite; }
  @keyframes scroll { from { transform: translateY(0); } to { transform: translateY(13px); } }
  .caret { animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .gp { opacity: 0; animation: gp 6s infinite; } .gv { opacity: 0; animation: gv 6s infinite; }
  @keyframes gp { 0%, 90%, 100% { transform: translate(0, 0); opacity: 0; } 91% { transform: translate(-6px, 1px); opacity: 0.85; } 93% { transform: translate(4px, -2px); opacity: 0.85; } 94.5% { opacity: 0; } }
  @keyframes gv { 0%, 90%, 100% { transform: translate(0, 0); opacity: 0; } 91% { transform: translate(6px, -1px); opacity: 0.85; } 93% { transform: translate(-5px, 2px); opacity: 0.85; } 94.5% { opacity: 0; } }
  .bar { transform-box: fill-box; transform-origin: left center; animation: barin 1.2s cubic-bezier(.2,.8,.2,1) backwards; }
  @keyframes barin { from { transform: scaleX(0); } }
  .fade { animation: fade 1.2s ease-out backwards; }
  @keyframes fade { from { opacity: 0; } }
  .draw { stroke-dasharray: var(--len); animation: draw 1.4s ease-out backwards; }
  @keyframes draw { from { stroke-dashoffset: var(--len); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
