# nginx_final.conf - srv-web (10.10.20.10)
# TLS hardening - TD4 - March 2026
# Applied in /etc/nginx/sites-available/td4
# Enabled: ln -s /etc/nginx/sites-available/td4 /etc/nginx/sites-enabled/

# Rate limiting zone (declared in the http block of nginx.conf)
# limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 8443 ssl;
    server_name td4.local;

    # Certificate (self-signed for the lab) - same path as TD4
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Protocols: TLS 1.2 and 1.3 only
    ssl_protocols TLSv1.2 TLSv1.3;

    # Modern cipher suites with forward secrecy
    ssl_ciphers 'ECDHE+AESGCM:ECDHE+CHACHA20:!aNULL:!MD5:!RC4';
    ssl_prefer_server_ciphers on;

    # HSTS
    add_header Strict-Transport-Security "max-age=300" always;

    # Sessions TLS
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  5m;
    ssl_session_tickets  off;

    # Basic User-Agent filtering (known scanning bots)
    if ($http_user_agent ~* "sqlmap|nikto|dirbuster") {
        return 403;
    }

    location /api {
        limit_req zone=api_limit burst=5 nodelay;
        return 200 "API response\n";
    }

    location / {
        return 200 "TLS lab endpoint hardened\n";
    }

    # Logs
    access_log /var/log/nginx/td4_access.log;
    error_log  /var/log/nginx/td4_error.log;
}
